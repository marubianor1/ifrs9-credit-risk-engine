[project]
name = "ifrs9-credit-risk-engine"
version = "0.1.0"
description = "Reproducible IFRS 9 credit risk and expected credit loss framework."
authors = [{ name = "Mario Rubiano" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.1.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "polars>=1.0.0,<2.0.0",
    "pyarrow>=17.0.0,<18.0.0",
    "duckdb>=1.0.0,<2.0.0",
    "scipy>=1.14.0,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "statsmodels>=0.14.0,<0.15.0",
    "pydantic>=2.8.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "plotly>=5.23.0,<6.0.0",
    "streamlit>=1.37.0,<2.0.0",
    "mlflow>=2.15.0,<3.0.0",
]

[tool.poetry]
packages = [{ include = "ifrs9", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
